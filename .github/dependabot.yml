# .github/dependabot.yml
#
# Dependabot configuré en mode alertes uniquement — aucune PR automatique.
# Les mises à jour sont gérées manuellement.

version: 2

updates:
  # ─── Dépendances npm ────────────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # 0 = pas de PRs automatiques, alertes de sécurité conservées
    open-pull-requests-limit: 0

  # ─── Actions GitHub ─────────────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
