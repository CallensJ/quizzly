# .github/dependabot.yml
#
# Configuration Dependabot — ouvre automatiquement des PRs quand une dépendance
# npm a une nouvelle version disponible.
#
# Dependabot vérifie chaque semaine et crée des PRs séparées par dépendance.
# La CI tourne automatiquement sur ces PRs → tu peux merger en confiance.

version: 2

updates:
  # ─── Dépendances npm ────────────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      # Vérification hebdomadaire le lundi matin
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Europe/Paris'

    # Regroupe les mises à jour mineures et patch ensemble (moins de PRs)
    # Les mises à jour majeures restent séparées (risque de casse)
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

    # Limite le nombre de PRs ouvertes en même temps
    open-pull-requests-limit: 5

    # Labels appliqués automatiquement aux PRs Dependabot
    labels:
      - 'dependencies'

  # ─── Actions GitHub ─────────────────────────────────────────────────────────
  # Maintient aussi les versions des actions utilisées dans les workflows CI
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'ci'
